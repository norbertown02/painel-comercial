<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nutrialle · Painel V1</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#0C0B0A}
    #painel-preview{display:block;width:100%;height:100%;border:0;background:#F4F2EF}
  </style>
</head>
<body>
  <iframe id="painel-preview" src="/index.html?nt_visual_source=v1" title="Preview visual do Painel Nutrialle"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('painel-preview')

      function applyVisualSystem() {
        try {
          const doc = frame.contentDocument
          if (!doc || !doc.head || !doc.body) return

          doc.body.classList.add('nt-planos-v1')

          if (!doc.getElementById('nt-planos-v1-css')) {
            const link = doc.createElement('link')
            link.id = 'nt-planos-v1-css'
            link.rel = 'stylesheet'
            link.href = '/painel-planos-v1.css?v=2026082701'
            doc.head.appendChild(link)
          }

          const decorate = () => {
            doc.body.classList.add('nt-planos-v1')
            const eyebrow = doc.querySelector('.seller-dashboard-block.hero .eyebrow')
            if (eyebrow && eyebrow.textContent.trim() === 'Portal Nutrialle') eyebrow.textContent = 'Visão geral'
          }

          decorate()
          if (!doc.__ntPlanosObserver) {
            doc.__ntPlanosObserver = new MutationObserver(decorate)
            doc.__ntPlanosObserver.observe(doc.body, { childList: true, subtree: true })
          }
        } catch (err) {
          console.error('Falha ao aplicar preview visual Nutrialle', err)
        }
      }

      frame.addEventListener('load', applyVisualSystem)
      setTimeout(applyVisualSystem, 400)
      setTimeout(applyVisualSystem, 1200)
    })()
  </script>
</body>
</html>
